[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-stats"
version = "0.2.0"
description = "Mission Control dashboard for Claude Code usage statistics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Amir" }]
keywords = ["claude", "cli", "dashboard", "statistics", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "textual>=0.89.0",
    "textual-plotext>=0.2.1",
    "rich>=13.0.0",
    "humanize>=4.0.0",
]

[project.scripts]
claude-stats = "claude_stats.app:main"

[project.urls]
Repository = "https://github.com/RedesignedRobot/claude-scripts"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_stats"]

[tool.hatch.build.targets.sdist]
include = ["/src"]
